<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Könyvtár</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container">
        <div>
        <h2>Könyv hozzáadása</h2>
        <input id="konyvCime" placeholder="Cím">
        <input id="konyvSzerzoje" placeholder="Szerző">
        <input id="kiadasi_ev" placeholder="Kiadási év">
        <input id="oldalszam" placeholder="Oldalszám">
        <button id="KonyvHozzaadasa">Könyv Hozzáadása</button>
        
    </div>
    <div>
        <button id="szuresGomb">Szűrés</button>
        <button id="legregebbi">Legrégebbi könyv</button>
        <button id="legvastagabb">Legvastagabb könyv</button>
        <button id="atlag">Átlagos oldalszám</button>
    </div>
    <div>
        <table id="table">
            
            <thead>
               <td>Cím</td>
               <td>Szerző</td>
               <td>Kiadási év</td>
               <td>Oldalszám</td>
            </thead>
            <tbody id="tablazat">
                
            </tbody>
           
            
        </table>
        <!-- <button id="kolcsonzesBtn">Kölcsönzés</button> -->
    </div>
    </div>

    

  



    <script src="main.js"></script>
</body>
</html>
